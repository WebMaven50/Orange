<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://orange-robot-store.victor-cb4.workers.dev; frame-src 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redeem Your Code — Orange Robot Store</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap');

  :root{
    --ink:        #0d0b09;
    --rust:       #b5541a;
    --rust-glow:  #e06820;
    --parchment2: #c8b89a;
    --smoke:      #1a1410;
    --smoke2:     #241d16;
    --smoke3:     #2e2519;
    --ash:        #7a6e62;
    --key-gold:   #c9a84c;
    --white:      #f5f0e8;
    --green:      #4caf50;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--ink);
    color: var(--white);
    font-family:'EB Garamond', Georgia, serif;
  }
  .wrap{ max-width:520px; margin:0 auto; padding:2.5rem 1.4rem 4rem; }

  .back-link{ font-family:'Inter', sans-serif; font-size:0.8rem; color:var(--ash); text-decoration:none; }
  .back-link:hover{ color:var(--key-gold); }

  h1{
    font-family:'Cinzel', serif; font-weight:700;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    color: var(--key-gold);
    text-align:center;
    margin: 1.4rem 0 0.4rem;
    letter-spacing:0.02em;
  }
  .subtitle{
    text-align:center; color:var(--parchment2); font-style:italic;
    font-size:1rem; margin-bottom:2rem;
  }

  .form-card{
    background: var(--smoke2); border:1px solid var(--smoke3); border-radius:10px;
    padding:1.6rem; margin-bottom:1.5rem;
  }
  .form-row{ margin-bottom:0.9rem; }
  .form-row label{
    display:block; font-family:'Inter', sans-serif; font-size:0.72rem; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--ash); margin-bottom:0.4rem;
  }
  .form-row input, .form-row select{
    width:100%; padding:0.7rem 0.8rem; border-radius:7px; border:1px solid var(--smoke3);
    background: var(--smoke); color:var(--white); font-family:'IBM Plex Mono', monospace; font-size:0.9rem;
  }
  .form-row input:focus, .form-row select:focus{ outline:none; border-color: var(--rust-glow); }

  .redeem-btn{
    width:100%; padding:0.9rem; border:none; border-radius:9px;
    background: linear-gradient(145deg, var(--rust-glow), var(--rust));
    color:#1a0f04; font-family:'Cinzel', serif; font-weight:700; font-size:0.95rem;
    letter-spacing:0.03em; cursor:pointer;
  }
  .redeem-btn:disabled{ opacity:0.45; cursor:default; }

  .result{ display:none; text-align:center; padding:1.6rem 1rem; }
  .result.visible{ display:block; }
  .result-emoji{ font-size:2.4rem; margin-bottom:0.5rem; }
  .result-title{ font-family:'Cinzel', serif; color:var(--key-gold); font-size:1.25rem; margin-bottom:0.5rem; }
  .result-text{ color:var(--parchment2); font-size:1rem; margin-bottom:1.2rem; line-height:1.6; }
  .download-btn{
    display:inline-block; padding:0.85rem 1.8rem; border-radius:9px;
    background: var(--key-gold); color:#1a1204; font-family:'Cinzel', serif; font-weight:700;
    text-decoration:none; letter-spacing:0.03em;
  }
  .error-text{ color:#d9534f; font-family:'Inter', sans-serif; font-size:0.85rem; text-align:center; margin-top:0.5rem; }
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="https://theorangerobot.com">← Back to The Orange Robot</a>

  <h1>Redeem Your Code</h1>
  <div class="subtitle">Got a code from us? Paste it below to get your free copy.</div>

  <div class="form-card" id="formCard">
    <div class="form-row">
      <label>Code</label>
      <input type="text" id="codeInput" placeholder="e.g. 5J1F7GHadZG3sCC..." />
    </div>
    <div class="form-row">
      <label>Format</label>
      <select id="formatInput">
        <option value="digital">Digital (EPUB)</option>
        <option value="audiobook">Audiobook</option>
      </select>
    </div>
    <button class="redeem-btn" id="redeemBtn">REDEEM</button>
    <div class="error-text" id="errorText"></div>
  </div>

  <div class="result" id="result">
    <div class="result-emoji">🎉</div>
    <div class="result-title">Your download is ready!</div>
    <div class="result-text" id="resultText"></div>
    <div id="resultAction"></div>
  </div>
</div>

<script>
(function(){
  const API_BASE = 'https://orange-robot-store.victor-cb4.workers.dev';
  const codeInput = document.getElementById('codeInput');
  const formatInput = document.getElementById('formatInput');
  const btn = document.getElementById('redeemBtn');
  const errorText = document.getElementById('errorText');
  const formCard = document.getElementById('formCard');
  const result = document.getElementById('result');

  async function redeem(){
    const code = codeInput.value.trim();
    const format = formatInput.value;
    errorText.textContent = '';
    if(!code){
      errorText.textContent = 'Enter your code.';
      return;
    }
    btn.disabled = true;
    try{
      const res = await fetch(API_BASE + '/promo/redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, format }),
      });
      const data = await res.json();
      if(!res.ok){
        errorText.textContent = data.error || 'Something went wrong.';
        btn.disabled = false;
        return;
      }
      showResult(data);
    } catch(e){
      errorText.textContent = 'Could not reach the store worker.';
      btn.disabled = false;
    }
  }

  function showResult(data){
    formCard.style.display = 'none';
    result.classList.add('visible');
    const label = data.format === 'audiobook' ? 'Audiobook' : 'Book';
    const downloadPath = data.format === 'audiobook' ? '/download/audiobook' : '/download/epub';
    document.getElementById('resultText').textContent = "Enjoy the " + label.toLowerCase() + " — thanks for checking it out.";
    document.getElementById('resultAction').innerHTML =
      '<a class="download-btn" href="' + API_BASE + downloadPath + '?order=' + encodeURIComponent(data.orderId) + '" download>⬇ Download Your ' + label + '</a>';
  }

  btn.addEventListener('click', redeem);
  codeInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') redeem(); });
})();
</script>
</body>
</html>
