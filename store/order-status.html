<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://orange-robot-store.victor-cb4.workers.dev; frame-src 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Your Order — Orange Robot Store</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap');

  :root{
    --ink:        #0d0b09;
    --rust:       #b5541a;
    --rust-glow:  #e06820;
    --parchment2: #c8b89a;
    --smoke:      #1a1410;
    --smoke2:     #241d16;
    --smoke3:     #2e2519;
    --ash:        #7a6e62;
    --key-gold:   #c9a84c;
    --white:      #f5f0e8;
    --green:      #4caf50;
    --amber:      #e0a020;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--ink);
    color: var(--white);
    font-family:'EB Garamond', Georgia, serif;
  }
  .wrap{ max-width:520px; margin:0 auto; padding:2.5rem 1.4rem 4rem; }

  .back-link{ font-family:'Inter', sans-serif; font-size:0.8rem; color:var(--ash); text-decoration:none; }
  .back-link:hover{ color:var(--key-gold); }

  h1{
    font-family:'Cinzel', serif; font-weight:700;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    color: var(--key-gold);
    text-align:center;
    margin: 1.4rem 0 0.4rem;
    letter-spacing:0.02em;
  }
  .subtitle{
    text-align:center; color:var(--parchment2); font-style:italic;
    font-size:1rem; margin-bottom:2rem;
  }

  .form-card{
    background: var(--smoke2); border:1px solid var(--smoke3); border-radius:10px;
    padding:1.6rem; margin-bottom:1.5rem;
  }
  .form-row label{
    display:block; font-family:'Inter', sans-serif; font-size:0.72rem; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--ash); margin-bottom:0.4rem;
  }
  .form-row input{
    width:100%; padding:0.7rem 0.8rem; border-radius:7px; border:1px solid var(--smoke3);
    background: var(--smoke); color:var(--white); font-family:'IBM Plex Mono', monospace; font-size:0.9rem;
    margin-bottom:0.9rem;
  }
  .form-row input:focus{ outline:none; border-color: var(--rust-glow); }

  .check-btn{
    width:100%; padding:0.9rem; border:none; border-radius:9px;
    background: linear-gradient(145deg, var(--rust-glow), var(--rust));
    color:#1a0f04; font-family:'Cinzel', serif; font-weight:700; font-size:0.95rem;
    letter-spacing:0.03em; cursor:pointer;
  }
  .check-btn:disabled{ opacity:0.45; cursor:default; }

  .result{ display:none; text-align:center; padding:1.6rem 1rem; }
  .result.visible{ display:block; }
  .result-emoji{ font-size:2.4rem; margin-bottom:0.5rem; }
  .result-title{ font-family:'Cinzel', serif; color:var(--key-gold); font-size:1.25rem; margin-bottom:0.5rem; }
  .result-text{ color:var(--parchment2); font-size:1rem; margin-bottom:1.2rem; line-height:1.6; }
  .status-pill{ display:inline-block; padding:2px 10px; border-radius:20px; font-size:0.75rem; font-weight:700; margin-bottom:0.8rem; }
  .status-ready{ background:rgba(76,175,80,0.15); color:var(--green); }
  .status-waiting{ background:rgba(224,160,32,0.15); color:var(--amber); }
  .download-btn{
    display:inline-block; padding:0.85rem 1.8rem; border-radius:9px;
    background: var(--key-gold); color:#1a1204; font-family:'Cinzel', serif; font-weight:700;
    text-decoration:none; letter-spacing:0.03em;
  }
  .error-text{ color:#d9534f; font-family:'Inter', sans-serif; font-size:0.85rem; text-align:center; margin-top:0.5rem; }
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="buy.html">← Back to Buy</a>

  <h1>Check Your Order</h1>
  <div class="subtitle">No email on file? Enter your order ID below to check your status and get your download.</div>

  <div class="form-card">
    <div class="form-row">
      <label>Order ID</label>
      <input type="text" id="orderIdInput" placeholder="e.g. ord_a1b2c3d4e5f6g7h8" />
    </div>
    <button class="check-btn" id="checkBtn">CHECK STATUS</button>
    <div class="error-text" id="errorText"></div>
  </div>

  <div class="result" id="result">
    <div class="result-emoji" id="resultEmoji">📦</div>
    <div class="result-title" id="resultTitle"></div>
    <div class="status-pill" id="statusPill"></div>
    <div class="result-text" id="resultText"></div>
    <div id="resultAction"></div>
  </div>
</div>

<script>
(function(){
  const API_BASE = 'https://orange-robot-store.victor-cb4.workers.dev';
  const input = document.getElementById('orderIdInput');
  const btn = document.getElementById('checkBtn');
  const errorText = document.getElementById('errorText');
  const result = document.getElementById('result');

  async function checkOrder(){
    const id = input.value.trim();
    errorText.textContent = '';
    result.classList.remove('visible');
    if(!id){
      errorText.textContent = 'Enter your order ID.';
      return;
    }
    btn.disabled = true;
    try{
      const res = await fetch(API_BASE + '/order/' + encodeURIComponent(id));
      if(res.status === 404){
        errorText.textContent = "We couldn't find that order — double check the ID.";
        btn.disabled = false;
        return;
      }
      if(!res.ok){
        errorText.textContent = 'Could not reach the store worker.';
        btn.disabled = false;
        return;
      }
      const data = await res.json();
      renderResult(data);
    } catch(e){
      errorText.textContent = 'Could not reach the store worker.';
    }
    btn.disabled = false;
  }

  function renderResult(o){
    result.classList.add('visible');
    const emoji = document.getElementById('resultEmoji');
    const title = document.getElementById('resultTitle');
    const pill = document.getElementById('statusPill');
    const text = document.getElementById('resultText');
    const action = document.getElementById('resultAction');
    action.innerHTML = '';

    if(o.format === 'digital' || o.format === 'audiobook'){
      const downloadPath = o.format === 'audiobook' ? '/download/audiobook' : '/download/epub';
      const label = o.format === 'audiobook' ? 'Audiobook' : 'Book';
      if(o.downloadReady){
        emoji.textContent = '🎉';
        title.textContent = 'Your download is ready!';
        pill.textContent = 'ready';
        pill.className = 'status-pill status-ready';
        text.textContent = "We've seen your payment — here's your " + label.toLowerCase() + ".";
        action.innerHTML = '<a class="download-btn" href="' + API_BASE + downloadPath + '?order=' + encodeURIComponent(o.id) + '" download>⬇ Download Your ' + label + '</a>';
      } else {
        emoji.textContent = '⏳';
        title.textContent = 'Still waiting on payment';
        pill.textContent = 'not seen yet';
        pill.className = 'status-pill status-waiting';
        text.textContent = "We haven't seen your payment show up on the network yet. This page updates live — check back in a few minutes, or just revisit this link any time.";
      }
    } else {
      emoji.textContent = '📦';
      title.textContent = o.status === 'paid' ? 'Payment confirmed' : 'Order received';
      pill.textContent = o.status === 'paid' ? 'paid' : 'awaiting verification';
      pill.className = 'status-pill ' + (o.status === 'paid' ? 'status-ready' : 'status-waiting');
      text.textContent = o.status === 'paid'
        ? "Your payment is confirmed — we'll get your print order placed and shipped soon."
        : "Once we confirm your payment on the blockchain, we'll place the print order and ship it out.";
    }
  }

  btn.addEventListener('click', checkOrder);
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') checkOrder(); });

  const params = new URLSearchParams(window.location.search);
  const prefill = params.get('order');
  if(prefill){
    input.value = prefill;
    checkOrder();
  }
})();
</script>
</body>
</html>
